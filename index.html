  --muted: #a9a187;
  --gold: #d8a928;
  --gold-hi: #f0c64a;
  --gold-text: #e6b93a;
  --on-gold: #241b00;
  --red: #d9473b;
  --red-soft: rgba(217, 71, 59, .14);
  --green: #4fb477;
  --green-soft: rgba(79, 180, 119, .15);
  --blue: #5b95d6;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --radius: 14px;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --header-h: 68px;
}
:root[data-theme="light"] {
  --bg: #f6f1e4;
  --bg-2: #efe8d5;
  --surface: #fffdf6;
  --surface-2: #f5efde;
  --border: #d9cca6;
  --border-soft: #e7dec3;
  --text: #241f10;
  --muted: #655d46;
  --gold: #b8860b;
  --gold-hi: #d4a017;
  --gold-text: #7d5a05;
  --on-gold: #fff9e6;
  --red: #b8342a;
  --red-soft: rgba(184, 52, 42, .1);
  --green: #1f7a47;
  --green-soft: rgba(31, 122, 71, .12);
  --blue: #2b62a8;
  --shadow: 0 10px 28px rgba(80, 60, 10, .14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body); background: var(--bg); color: var(--text);
  line-height: 1.55; min-height: 100vh; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
main { flex: 1; outline: none; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { line-height: 1.2; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--gold); color: var(--on-gold); padding: 10px 16px; border-radius: 8px; font-weight: 600; }
.skip-link:focus { top: 12px; }
.container { width: min(1160px, 100% - 40px); margin-inline: auto; }
.i { flex-shrink: 0; vertical-align: -3px; }

/* ---------- Header ---------- */
.site-header { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border-soft); }
.site-header .bar { width: min(1160px, 100% - 40px); margin-inline: auto; height: var(--header-h); display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.brand img { width: 42px; height: 45px; object-fit: contain; }
.brand b { display: block; font-family: var(--font-display); font-size: 1.25rem; letter-spacing: .01em; line-height: 1.1; }
.brand small { display: block; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-text); }
.crumbs { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; list-style: none; min-width: 0; }
.crumbs li { display: flex; align-items: center; gap: 4px; font-size: .8rem; color: var(--muted); white-space: nowrap; }
.crumbs li + li::before { content: ""; width: 18px; height: 1px; background: var(--border); margin-right: 4px; }
.crumbs a, .crumbs span { display: flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px; }
.crumbs a:hover { color: var(--text); background: var(--surface); }
.crumbs .n { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; font-size: .68rem; font-weight: 600; }
.crumbs .done .n { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.crumbs .current { color: var(--text); font-weight: 600; background: var(--surface); }
.crumbs .current .n { border-color: var(--gold-hi); color: var(--gold-text); }
.hdr-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.crumbs ~ .hdr-actions { margin-left: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.icon-btn:hover { border-color: var(--gold); background: var(--surface-2); }
.user-chip { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); padding: 6px 6px 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); max-width: 260px; }
.user-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-chip button { border: 0; background: var(--surface-2); border-radius: 999px; padding: 5px 10px; font-size: .78rem; display: flex; align-items: center; gap: 5px; }
.user-chip button:hover { color: var(--gold-hi); }
.pole { height: 5px; background: repeating-linear-gradient(135deg, #c8352b 0 12px, #f2ecda 12px 24px, #2f5fa8 24px 36px, #f2ecda 36px 48px); opacity: .9; }

/* ---------- Tombol ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 10px; padding: 11px 20px; font-weight: 600; font-size: .94rem; line-height: 1.2; transition: transform .12s, filter .15s, background .15s, border-color .15s; text-align: center; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: var(--on-gold); border-color: var(--gold); box-shadow: 0 4px 14px color-mix(in srgb, var(--gold) 28%, transparent); }
:root[data-theme="light"] .btn-primary { background: linear-gradient(180deg, #c9961a, #a97b0b); color: #fff9e6; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-outline { background: transparent; border-color: var(--gold); color: var(--gold-text); }
.btn-outline:hover { background: color-mix(in srgb, var(--gold) 14%, transparent); }
.btn-ghost { background: var(--surface-2); border-color: var(--border); color: var(--text); }
.btn-ghost:hover { border-color: var(--gold); }
.btn-danger { background: transparent; border-color: color-mix(in srgb, var(--red) 55%, transparent); color: var(--red); }
.btn-danger:hover { background: var(--red-soft); }
.btn-sm { padding: 7px 12px; font-size: .82rem; border-radius: 8px; }
.btn-lg { padding: 14px 26px; font-size: 1rem; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

/* ---------- Umum ---------- */
.card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 22px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-text); font-weight: 600; }
.eyebrow::before { content: ""; width: 26px; height: 1px; background: var(--gold); }
.section { padding: 72px 0; }
.section-head { max-width: 640px; margin-bottom: 34px; }
.section-head h2 { font-family: var(--font-display); font-size: clamp(1.7rem, 3vw, 2.3rem); margin-top: 10px; }
.section-head p { color: var(--muted); margin-top: 10px; }
.page { padding: 34px 0 72px; }
.page-head { margin-bottom: 26px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; justify-content: space-between; }
.page-head h1 { font-family: var(--font-display); font-size: clamp(1.7rem, 3.2vw, 2.4rem); }
.page-head p { color: var(--muted); margin-top: 6px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .88rem; background: none; border: 0; padding: 6px 0; margin-bottom: 12px; }
.back-link:hover { color: var(--gold-hi); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.badge.open, .badge.done { background: var(--green-soft); color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
.badge.closed, .badge.cancelled { background: var(--red-soft); color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
.badge.working { background: color-mix(in srgb, var(--gold) 20%, transparent); color: var(--gold-text); border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
.badge.soon { background: var(--surface-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.dot.pulse { animation: pulse 1.8s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 55%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.empty { color: var(--muted); padding: 22px; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); font-size: .92rem; }

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(900px 500px at 85% 20%, color-mix(in srgb, var(--gold) 20%, transparent), transparent 60%), radial-gradient(600px 400px at 0% 100%, color-mix(in srgb, var(--blue) 12%, transparent), transparent 60%); pointer-events: none; }
.hero .container { position: relative; display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: center; padding: 64px 0 72px; }
.hero h1 { font-family: var(--font-display); font-size: clamp(2.3rem, 5vw, 3.8rem); font-weight: 800; margin: 16px 0 18px; letter-spacing: -.01em; }
.hero h1 em { font-style: italic; color: var(--gold-text); }
.hero-lead { color: var(--muted); font-size: 1.08rem; max-width: 540px; }
.role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 30px; max-width: 600px; }
.role-card { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 8px; transition: border-color .15s, transform .15s, background .15s; }
.role-card:hover { border-color: var(--gold); transform: translateY(-3px); background: var(--surface-2); }
.role-card .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold-text); }
.role-card b { font-size: 1.05rem; letter-spacing: .06em; }
.role-card span.d { font-size: .85rem; color: var(--muted); }
.role-card .go { margin-top: 4px; color: var(--gold-text); font-size: .85rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.live-chip { margin-top: 22px; display: inline-flex; align-items: center; gap: 10px; font-size: .86rem; color: var(--muted); padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
.live-chip b { color: var(--text); }
.live-chip .dot { color: var(--green); }
.hero-art { display: grid; place-items: center; }
.ring { position: relative; width: min(380px, 80vw); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--gold) 16%, var(--surface)), var(--bg-2) 72%); border: 1px solid var(--border); box-shadow: var(--shadow), inset 0 0 60px rgba(0, 0, 0, .25); }
.ring::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--gold) 45%, transparent); animation: spin 60s linear infinite; }
.ring img { width: 66%; filter: drop-shadow(0 12px 22px rgba(0, 0, 0, .5)); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Beranda: sections ---------- */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; counter-reset: s; }
.step { position: relative; }
.step .num { font-family: var(--font-display); font-size: 2.6rem; color: var(--gold-text); opacity: .85; line-height: 1; }
.step h3 { margin: 12px 0 6px; font-size: 1.08rem; }
.step p { color: var(--muted); font-size: .92rem; }
.band { background: var(--bg-2); border-block: 1px solid var(--border-soft); }
.price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.price-card { display: flex; flex-direction: column; gap: 10px; padding: 20px; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); }
.price-card .nm { font-weight: 600; }
.price-card .pr { font-family: var(--font-display); font-size: 1.7rem; color: var(--gold-text); }
.price-card .mn { color: var(--muted); font-size: .82rem; display: flex; align-items: center; gap: 6px; }
.feat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.feat { padding: 22px; border-radius: var(--radius); border: 1px solid var(--border-soft); background: var(--surface); }
.feat .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--gold-text); margin-bottom: 14px; }
.feat h3 { font-size: 1.02rem; margin-bottom: 6px; }
.feat p { color: var(--muted); font-size: .9rem; }

/* ---------- Footer ---------- */
.site-footer { background: var(--bg-2); border-top: 1px solid var(--border-soft); margin-top: auto; }
.foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; padding: 44px 0 28px; }
.foot-grid h4 { font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-text); margin-bottom: 12px; }
.foot-grid p, .foot-grid li { color: var(--muted); font-size: .9rem; list-style: none; margin-bottom: 6px; }
.foot-grid li a:hover { color: var(--gold-hi); }
.foot-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.foot-brand img { width: 46px; }
.foot-brand b { font-family: var(--font-display); font-size: 1.3rem; }
.copy { border-top: 1px solid var(--border-soft); padding: 16px 0 22px; color: var(--muted); font-size: .8rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

/* ---------- Formulir ---------- */
.form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: .84rem; font-weight: 500; color: var(--muted); }
.field input, .field select, .field textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; width: 100%; transition: border-color .15s, box-shadow .15s; }
:root[data-theme="light"] .field input, :root[data-theme="light"] .field select, :root[data-theme="light"] .field textarea { background: #fff; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
.field input::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
.field .err { color: var(--red); font-size: .8rem; min-height: 1.1em; }
.field .hint { color: var(--muted); font-size: .78rem; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 46px; }
.pw-wrap button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); border-radius: 8px; }
.pw-wrap button:hover { color: var(--gold-hi); }
.meter { height: 5px; background: var(--border-soft); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--red); transition: width .2s, background .2s; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-error { background: var(--red-soft); color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); padding: 10px 14px; border-radius: 10px; font-size: .88rem; }
.form-note { background: color-mix(in srgb, var(--gold) 12%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); color: var(--text); padding: 10px 14px; border-radius: 10px; font-size: .85rem; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { position: relative; }
.pill input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.pill span { display: inline-flex; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); font-size: .88rem; }
.pill input:checked + span { background: var(--gold); border-color: var(--gold); color: var(--on-gold); font-weight: 600; }
.pill input:focus-visible + span { outline: 2px solid var(--gold-hi); outline-offset: 2px; }

/* ---------- Welcome & Auth ---------- */
.welcome { min-height: calc(100vh - 220px); display: grid; place-items: center; padding: 40px 0; }
.welcome-card { width: min(520px, 100%); text-align: center; padding: 44px 34px; }
.welcome-card img { width: 170px; margin: 0 auto 18px; filter: drop-shadow(0 10px 20px rgba(0, 0, 0, .4)); }
.welcome-card h1 { font-family: var(--font-display); font-size: 1.8rem; }
.welcome-card p { color: var(--muted); margin: 8px 0 26px; }
.welcome-card .btns { display: grid; gap: 12px; }
.auth { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - var(--header-h) - 5px); }
.auth-aside { position: relative; padding: 56px 48px; display: flex; flex-direction: column; justify-content: center; gap: 22px; background: radial-gradient(700px 500px at 20% 0%, color-mix(in srgb, var(--gold) 22%, transparent), transparent 65%), var(--bg-2); border-right: 1px solid var(--border-soft); }
.auth-aside img { width: 200px; filter: drop-shadow(0 12px 24px rgba(0, 0, 0, .45)); }
.auth-aside h2 { font-family: var(--font-display); font-size: 2rem; max-width: 420px; }
.auth-aside ul { list-style: none; display: grid; gap: 12px; color: var(--muted); }
.auth-aside li { display: flex; gap: 10px; align-items: flex-start; }
.auth-aside li svg { color: var(--gold-text); margin-top: 3px; }
.auth-main { display: grid; place-items: center; padding: 40px 24px; }
.auth-form { width: min(420px, 100%); }
.auth-form h1 { font-family: var(--font-display); font-size: 1.9rem; margin-bottom: 6px; }
.auth-form .sub { color: var(--muted); margin-bottom: 24px; }
.auth-switch { text-align: center; margin-top: 18px; color: var(--muted); font-size: .9rem; }
.auth-switch a { color: var(--gold-text); font-weight: 600; }
.demo-box { margin-top: 18px; font-size: .82rem; color: var(--muted); border: 1px dashed var(--border); border-radius: 10px; padding: 10px 14px; }

.map-page iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
:root[data-theme="dark"] .map-page iframe { filter: invert(.92) hue-rotate(180deg) saturate(.8) brightness(.95); }
.map-card { position: absolute; left: max(20px, calc((100% - 1160px) / 2)); top: 28px; width: min(380px, calc(100% - 40px)); background: color-mix(in srgb, var(--surface) 96%, transparent); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.map-card .top { display: flex; align-items: center; gap: 14px; }
.map-card .top img { width: 62px; height: 62px; border-radius: 12px; object-fit: cover; }
.map-card h1 { font-family: var(--font-display); font-size: 1.25rem; }
.info-list { list-style: none; display: grid; gap: 9px; font-size: .88rem; color: var(--muted); }
.info-list li { display: flex; gap: 10px; align-items: flex-start; }
.info-list svg { color: var(--gold-text); margin-top: 3px; }
.info-list b { color: var(--text); font-weight: 500; }
.map-card .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.map-card .btns .btn-primary { grid-column: 1 / -1; }

/* ---------- Daftar pilihan ---------- */
.search { position: relative; width: min(340px, 100%); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; padding: 11px 14px 11px 40px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); }
.search input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.choice { display: flex; align-items: center; gap: 16px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 20px; transition: border-color .15s, transform .15s, background .15s; }
.choice:hover { border-color: var(--gold); transform: translateY(-3px); background: var(--surface-2); }
.choice .ico { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--gold-text); flex-shrink: 0; }
.choice .tx { flex: 1; min-width: 0; }
.choice b { display: block; font-size: 1.02rem; }
.choice small { color: var(--muted); font-size: .82rem; }
.choice .arrow { color: var(--gold-text); }
.shop-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.shop-card { display: flex; flex-direction: column; text-align: left; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; transition: border-color .15s, transform .15s; width: 100%; padding: 0; }
.shop-card:hover { border-color: var(--gold); transform: translateY(-3px); }
.shop-card .cover { height: 132px; background: linear-gradient(135deg, #25221a, #12100c); display: grid; place-items: center; position: relative; }
.shop-card .cover img { height: 100%; width: 100%; object-fit: cover; }
.shop-card .cover .badge { position: absolute; top: 12px; right: 12px; }
.shop-card.soon .cover { color: var(--muted); }
.shop-card.soon { opacity: .78; }
.shop-card .body { padding: 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.shop-card h3 { font-size: 1.1rem; }
.shop-card .meta { display: flex; flex-wrap: wrap; gap: 12px; font-size: .82rem; color: var(--muted); }
.shop-card .meta span { display: inline-flex; align-items: center; gap: 6px; }
.shop-card .cta { margin-top: auto; color: var(--gold-text); font-weight: 600; font-size: .88rem; display: flex; align-items: center; gap: 6px; }

/* ---------- Dashboard ---------- */
.shop-head { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; padding: 22px; background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 12%, var(--surface)), var(--surface)); border: 1px solid var(--border); border-radius: 18px; }
.shop-head img.logo { width: 92px; height: 92px; border-radius: 16px; object-fit: cover; border: 1px solid var(--border); }
.shop-head .info { flex: 1; min-width: 240px; }
.shop-head h1 { font-family: var(--font-display); font-size: clamp(1.4rem, 3vw, 2rem); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.shop-head .sub { color: var(--muted); font-size: .9rem; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
.shop-head .sub span { display: inline-flex; align-items: center; gap: 6px; }
.shop-head .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.switch { display: inline-flex; align-items: center; gap: 10px; font-size: .88rem; font-weight: 500; background: var(--bg); border: 1px solid var(--border); padding: 7px 12px 7px 8px; border-radius: 999px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; }
.switch .tr { width: 38px; height: 22px; border-radius: 999px; background: var(--border); position: relative; transition: background .2s; }
.switch .tr::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked + .tr { background: var(--green); }
.switch input:checked + .tr::after { transform: translateX(16px); }
.switch input:focus-visible + .tr { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 18px auto 0; }
.stat { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px 18px; display: flex; gap: 14px; align-items: center; }
.stat .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--gold-text); flex-shrink: 0; }
.stat small { display: block; font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat b { font-size: 1.5rem; font-family: var(--font-display); line-height: 1.2; }
.tabs { display: flex; gap: 4px; margin: 26px auto 0; border-bottom: 1px solid var(--border-soft); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-size: .92rem; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-current="page"] { color: var(--gold-text); border-color: var(--gold); font-weight: 600; }
.tab-body { padding: 26px 0 72px; }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.stack { display: grid; gap: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.sec-title { display: flex; align-items: center; gap: 10px; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-text); font-weight: 600; margin: 8px 0 -2px; }
.sec-title .cnt { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 0 8px; letter-spacing: 0; font-size: .72rem; }
.next-wrap { border: 1.5px solid var(--gold); border-radius: 16px; padding: 14px; background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 12%, var(--surface)), var(--surface)); }
.next-wrap > .lbl { display: flex; align-items: center; gap: 8px; color: var(--gold-text); font-weight: 700; font-size: .82rem; margin-bottom: 10px; }
.next-wrap .qcard { background: transparent; border: 0; padding: 0; }
.qcard { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 16px; align-items: center; }
.qcard.mine { border-color: var(--gold); box-shadow: 0 0 0 1px color-mix(in srgb, var(--gold) 40%, transparent); }
.qcard.working { border-left: 4px solid var(--gold); }
.tk { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--gold-text); background: color-mix(in srgb, var(--gold) 14%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); border-radius: 10px; padding: 8px 12px; grid-row: span 2; text-align: center; min-width: 66px; }
.qcard .nm { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qcard .nm .you { font-size: .72rem; color: var(--gold-text); font-weight: 600; background: color-mix(in srgb, var(--gold) 16%, transparent); padding: 1px 8px; border-radius: 999px; }
.qcard .age { font-size: .76rem; color: var(--muted); font-weight: 400; }
.qcard .right { text-align: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; grid-row: span 2; }
.qcard .price { font-weight: 700; color: var(--gold-text); }
.qcard .meta { color: var(--muted); font-size: .84rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.qcard .meta span { display: inline-flex; align-items: center; gap: 5px; }
.q-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
.side { display: grid; gap: 16px; position: sticky; top: calc(var(--header-h) + 20px); }
.side h3 { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-text); margin-bottom: 14px; }
.mini-price { list-style: none; display: grid; gap: 10px; font-size: .88rem; }
.mini-price li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--border-soft); padding-bottom: 8px; }
.mini-price li:last-child { border: 0; padding: 0; }
.mini-price b { color: var(--gold-text); white-space: nowrap; }

/* Tiket pelanggan */
.ticket { position: relative; border-radius: 18px; padding: 22px; background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 22%, var(--surface)), var(--surface) 70%); border: 1.5px solid var(--gold); overflow: hidden; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--gold); transform: translateY(-50%); }
.ticket::before { left: -12px; } .ticket::after { right: -12px; }
.ticket .t-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.ticket .t-lbl { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-text); font-weight: 600; }
.ticket .t-no { font-family: var(--font-display); font-size: 3.2rem; font-weight: 800; line-height: 1; margin-top: 4px; }
.ticket .t-msg { margin-top: 14px; font-weight: 600; font-size: 1.02rem; }
.ticket .t-sub { color: var(--muted); font-size: .88rem; margin-top: 2px; }
.ticket .t-stats { display: flex; gap: 26px; margin: 16px 0; padding: 14px 0; border-block: 1px dashed var(--border); }
.ticket .t-stats small { display: block; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.ticket .t-stats b { font-size: 1.25rem; font-family: var(--font-display); }
.progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: .72rem; color: var(--muted); }
.progress div { border-top: 4px solid var(--border); padding-top: 6px; }
.progress div.on { border-color: var(--gold); color: var(--text); font-weight: 600; }
.ticket .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.cta-card { text-align: center; padding: 28px 22px; display: grid; gap: 10px; justify-items: center; }
.cta-card .ico { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--gold-text); }
.cta-card h3 { font-family: var(--font-display); font-size: 1.3rem; }
.cta-card p { color: var(--muted); font-size: .9rem; max-width: 340px; }

/* Layanan */
.svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.svc-card { display: flex; flex-direction: column; gap: 8px; padding: 20px; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); }
.svc-card .nm { font-weight: 600; font-size: 1.02rem; }
.svc-card .pr { font-family: var(--font-display); font-size: 1.6rem; color: var(--gold-text); }
.svc-card .mn { color: var(--muted); font-size: .84rem; display: flex; align-items: center; gap: 6px; }
.svc-card .acts { margin-top: auto; padding-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

/* Laporan */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi { padding: 18px; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); }
.kpi small { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; }
.kpi b { display: block; font-family: var(--font-display); font-size: 1.55rem; margin-top: 4px; }
.report-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; margin-bottom: 18px; }
.report-grid h3, .table-card h3 { font-size: 1rem; margin-bottom: 4px; }
.report-grid .sub, .table-card .sub { color: var(--muted); font-size: .82rem; margin-bottom: 14px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid { stroke: var(--border-soft); stroke-width: 1; }
.chart .bar { fill: color-mix(in srgb, var(--gold) 55%, var(--surface)); }
.chart .bar.today { fill: var(--gold-hi); }
.chart .val { fill: var(--text); font-weight: 600; }
.hbars { display: grid; gap: 14px; }
.hbar .top { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: 5px; gap: 10px; }
.hbar .top span:last-child { color: var(--muted); white-space: nowrap; }
.hbar .track { height: 8px; border-radius: 6px; background: var(--border-soft); overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-hi)); border-radius: 6px; }
.table-card { padding: 0; overflow: hidden; }
.table-card .hd { padding: 20px 22px 0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; }
.table-wrap { overflow-x: auto; margin-top: 12px; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 680px; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 22px; background: var(--surface-2); font-weight: 600; }
td { padding: 12px 22px; border-top: 1px solid var(--border-soft); }
td.num, th.num { text-align: right; }
.sample { font-size: .68rem; color: var(--muted); border: 1px solid var(--border); padding: 0 6px; border-radius: 6px; margin-left: 6px; }

/* Pengaturan */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.settings-grid h3 { font-size: 1.05rem; margin-bottom: 4px; }
.settings-grid .sub { color: var(--muted); font-size: .86rem; margin-bottom: 16px; }
.danger-zone { grid-column: 1 / -1; border-color: color-mix(in srgb, var(--red) 40%, var(--border-soft)); }
.danger-zone .acts { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- Modal & Toast ---------- */
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(5, 4, 2, .65); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; overflow-y: auto; }
.dialog { width: min(480px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 26px; box-shadow: var(--shadow); animation: pop .18s ease-out; max-height: calc(100vh - 40px); overflow-y: auto; }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
.dialog h2 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 4px; }
.dialog .sub { color: var(--muted); font-size: .9rem; margin-bottom: 18px; }
.dialog .acts { display: grid; gap: 10px; margin-top: 8px; }
.dialog .acts.two { grid-template-columns: 1fr 1fr; }
.sum { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--gold) 12%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); font-size: .88rem; }
.sum b { color: var(--gold-text); }
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 80; display: grid; gap: 10px; width: min(360px, calc(100% - 40px)); }
.toast { display: flex; gap: 12px; align-items: flex-start; background: var(--surface-2); border: 1px solid var(--border); border-left: 4px solid var(--gold); color: var(--text); padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); font-size: .9rem; animation: pop .2s ease-out; }
.toast.error { border-left-color: var(--red); }
.toast.success { border-left-color: var(--green); }
.toast svg { margin-top: 2px; }

/* ---------- Responsif ---------- */
@media (max-width: 1060px) {
  .crumbs { display: none; }
  .hdr-actions { margin-left: auto !important; }
  .dash-grid { grid-template-columns: 1fr; }
  .side { position: static; }
  .stats, .kpis { grid-template-columns: repeat(2, 1fr); }
  .report-grid, .settings-grid { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .hero .container { grid-template-columns: 1fr; padding-top: 40px; }
  .hero-art { order: -1; }
  .ring { width: min(240px, 60vw); }
  .steps, .price-grid, .feat-grid { grid-template-columns: 1fr; }
  .auth { grid-template-columns: 1fr; }
  .auth-aside { display: none; }
  .foot-grid { grid-template-columns: 1fr; }
  .section { padding: 48px 0; }
  .map-card { top: auto; bottom: 16px; left: 12px; right: 12px; width: auto; padding: 16px; }
  .map-card .info-list { display: none; }
  .map-page { min-height: 520px; }
}
@media (max-width: 560px) {
  .container, .site-header .bar { width: calc(100% - 28px); }
  .role-grid, .row-2 { grid-template-columns: 1fr; }
  .brand small { display: none; }
  .user-chip span { display: none; }
  .user-chip { padding: 4px; }
  .qcard { grid-template-columns: auto 1fr; }
  .qcard .right { grid-row: auto; grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
  .stat { padding: 12px; gap: 10px; }
  .stat .ico { display: none; }
  .stat b { font-size: 1.25rem; }
  .shop-head { padding: 16px; }
  .shop-head img.logo { width: 68px; height: 68px; }
  .dialog { padding: 20px; }
  .toasts { left: 14px; right: 14px; bottom: 14px; width: auto; }
  .ticket .t-no { font-size: 2.6rem; }
  .welcome-card { padding: 30px 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media print {
  .site-header, .site-footer, .tabs, .toasts, .modal, .shop-head .tools, .no-print, .stats, .skip-link { display: none !important; }
  body { background: #fff; color: #000; }
  :root { --surface: #fff; --surface-2: #f3f3f3; --border: #bbb; --border-soft: #ddd; --text: #000; --muted: #444; --gold-text: #6b4a00; --bg: #fff; --bg-2: #fff; }
  .card, .kpi, .table-card { break-inside: avoid; box-shadow: none; }
}

const KEY = "wber_v2";
const SESSION_KEY = "wber_session";
const ls = {

};

async function hashPass(pass, salt) {
  const data = new TextEncoder().encode(`${salt}:${pass}`);
  if (globalThis.crypto?.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(buf)].map((b) => pad(b.toString(16))).join("");
  }
  let h = 5381; for (const b of data) h = ((h << 5) + h + b) >>> 0;
  return "f" + h.toString(16);
}
const newSalt = () => Array.from(crypto?.getRandomValues ? crypto.getRandomValues(new Uint8Array(8)) : [Math.random() * 255 | 0, Math.random() * 255 | 0], (b) => pad(b.toString(16))).join("");
async function makeUser(email, pass) { const salt = newSalt(); return { email, salt, hash: await hashPass(pass, salt) }; }

function demoHistory() {
  const names = ["Rizky", "Dimas", "Bayu", "Fadli", "Hendra", "Rafi", "Joko", "Andi", "Surya", "Ilham", "Naufal", "Putra"];
  let r = 7; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const out = [];
  for (let d = 6; d >= 1; d--) {
    const count = 5 + Math.floor(rnd() * 6);
    for (let i = 0; i < count; i++) {
      const s = DEFAULT_SERVICES[Math.floor(rnd() * DEFAULT_SERVICES.length)];
      const dt = new Date(); dt.setDate(dt.getDate() - d); dt.setHours(10 + Math.floor(rnd() * 10), Math.floor(rnd() * 60), 0, 0);
      const iso = dt.toISOString();
      out.push({ id: dt.getTime() + i, no: ticketNo(i + 1), name: names[Math.floor(rnd() * names.length)], age: AGE_GROUPS[Math.floor(rnd() * 3)], service: s.id, serviceName: s.name, price: s.price, mins: s.mins, phone: "", status: "done", method: PAYMENTS[Math.floor(rnd() * 3)], createdAt: iso, endedAt: iso, demo: true });
    }
  }
  return out;
}
function seedDb() {
  const now = Date.now();
  const mk = (n, name, age, service, phone, minsAgo) => ({ id: now + n, no: ticketNo(n), name, age, service, phone, status: "waiting", createdAt: new Date(now - minsAgo * 60000).toISOString() });
  return {
    users: [],
    queue: [mk(1, "Asep", "Dewasa", "pijat", "081200000001", 35), mk(2, "Agus", "Anak-anak", "potong", "081200000002", 20), mk(3, "Fajri", "Remaja", "cuci", "081200000003", 8)],
    history: demoHistory(),
    services: DEFAULT_SERVICES.map((s) => ({ ...s })),
    settings: { ...DEFAULT_SETTINGS },
    seq: 3, seqDay: dayKey(), mine: [],
  };
}
async function initDb() {
  db = ls.get(KEY) || seedDb();
  db.settings = { ...DEFAULT_SETTINGS, ...(db.settings || {}) };
  db.services ||= DEFAULT_SERVICES.map((s) => ({ ...s }));
  db.queue ||= []; db.history ||= []; db.mine ||= []; db.users ||= [];
  if (db.seqDay !== dayKey()) { db.seq = 0; db.seqDay = dayKey(); }
  // Migrasi akun versi lama (kata sandi teks biasa) → disimpan sebagai hash
  const legacy = ls.get("wber_users");
  if (Array.isArray(legacy)) {
    for (const u of legacy) if (u.email && u.pass && !db.users.some((x) => x.email === u.email)) db.users.push(await makeUser(u.email, u.pass));
    try { localStorage.removeItem("wber_users"); } catch {}
  }
  if (!db.users.length) db.users.push(await makeUser(DEMO_OWNER.email, DEMO_OWNER.pass));
  save();
  session = ls.get(SESSION_KEY) || session;
  if (session.role === "pemilik" && !db.users.some((u) => u.email === session.email)) session = { role: "pemilik", email: null };
}

const isOwner = () => session.role === "pemilik" && !!session.email;
const svc = (id) => db.services.find((s) => s.id === id) || { id, name: "Layanan (dihapus)", price: 0, mins: 30 };
const waiting = () => db.queue.filter((q) => q.status === "waiting");
const working = () => db.queue.filter((q) => q.status === "working");
const isToday = (iso) => dayKey(new Date(iso)) === dayKey();
const doneToday = () => db.history.filter((h) => h.status === "done" && isToday(h.endedAt));
const revenueToday = () => doneToday().reduce((a, h) => a + h.price, 0);
const myTicket = () => db.queue.find((q) => db.mine.includes(q.id));
const roundEta = (m) => Math.max(0, Math.round(m / 5) * 5);
function remaining(q) {
  const m = svc(q.service).mins;
  if (q.status !== "working") return m;
  const elapsed = (Date.now() - new Date(q.startedAt || q.createdAt)) / 60000;
  return Math.max(5, m - elapsed);
}
const orderList = () => [...working(), ...waiting()];
function etaFor(q) {
  const list = orderList(), i = list.findIndex((x) => x.id === q.id);
  const ahead = list.slice(0, Math.max(0, i));
  if (ahead.length < db.settings.chairs) return 0;
  return roundEta(ahead.reduce((a, x) => a + remaining(x), 0) / db.settings.chairs);
}
function etaNew() {
  const list = orderList();
  if (list.length < db.settings.chairs) return 0;
  return roundEta(list.reduce((a, x) => a + remaining(x), 0) / db.settings.chairs);
}
function nextTicketNo() {
  if (db.seqDay !== dayKey()) { db.seq = 0; db.seqDay = dayKey(); }
  db.seq += 1; return ticketNo(db.seq);
}
function toHistory(q, status, extra = {}) {
  const s = svc(q.service);
  db.history.push({ id: q.id, no: q.no, name: q.name, age: q.age, service: q.service, serviceName: s.name, price: status === "done" ? s.price : 0, mins: s.mins, phone: q.phone, status, method: null, createdAt: q.createdAt, endedAt: new Date().toISOString(), ...extra });
}
function withinHours() {
  const n = new Date(), cur = n.getHours() * 60 + n.getMinutes();
  const [oh, om] = db.settings.open.split(":").map(Number), [ch, cm] = db.settings.close.split(":").map(Number);

}

function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("?")[0].split("/").filter(Boolean).map(decodeURIComponent);
  return { p0: parts[0] || "", p1: parts[1], p2: parts[2] };

function render(opts = {}) {
  const { p0, p1, p2 } = parseRoute();
  let html = "", title = "";

  switch (p0) {
    case "":
      html = viewSplash(); title = "Antrian Online"; break;
    case "welcome": case "login": case "register":

      if (isOwner()) return redirect(shopPath());

    case "areas":
      if (needRole()) return; html = viewAreas(); title = "Pilih Wilayah"; break;
    case "shops":
      if (needRole()) return;
      if (!AREAS.includes(p1)) return redirect("/areas");
      lastArea = p1; html = viewShops(p1); title = `Tempat di ${p1}`; break;
    case "shop": {
      if (needRole()) return;
      if (p1 !== ACTIVE_SHOP) return redirect("/areas");

      const allowed = isOwner() ? ["antrian", "layanan", "info", "riwayat", "pengaturan"] : ["antrian", "layanan", "info"];

    }

  document.title = `${title} · WberShop`;

}

/* --- Kartu antrian --- */
function card(q, owner) {
  const s = svc(q.service), mineQ = db.mine.includes(q.id), mins = etaFor(q);
  const statusBadge = q.status === "working" ? `<span class="badge working">${icon("scissors", 12)} Dikerjakan</span>` : `<span class="badge">Menunggu</span>`;
  const eta = q.status === "waiting" ? `<span>${icon("clock", 14)} ${mins ? `Mulai ±${mins} mnt lagi` : "Giliran berikutnya"}</span>` : `<span>${icon("clock", 14)} Mulai ${fmtTime(q.startedAt || q.createdAt)}</span>`;
  let acts = "";
  if (owner) {
    const wa = `<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${waLink(q.phone, `Halo ${q.name}, ini WberShop. Nomor antrean Anda ${q.no}. ${q.status === "waiting" ? "Mohon bersiap, giliran Anda segera tiba." : "Giliran Anda sedang berlangsung."}`)}">${icon("chat", 14)} WhatsApp</a>`;
    acts = q.status === "waiting"
      ? `<button class="btn btn-primary btn-sm" data-action="call" data-id="${q.id}">${icon("play", 14)} Panggil</button><button class="btn btn-ghost btn-sm" data-action="skip" data-id="${q.id}">${icon("skip", 14)} Lewati</button>${wa}<button class="btn btn-danger btn-sm" data-action="cancel" data-id="${q.id}">${icon("x", 14)} Batalkan</button>`
      : `<button class="btn btn-primary btn-sm" data-action="finish" data-id="${q.id}">${icon("check", 14)} Selesai</button>${wa}<button class="btn btn-danger btn-sm" data-action="cancel" data-id="${q.id}">${icon("x", 14)} Batalkan</button>`;
  } else if (mineQ && q.status === "waiting") {
    acts = `<button class="btn btn-danger btn-sm" data-action="cancel" data-id="${q.id}">Batalkan antrean saya</button>`;
  }
  const shown = owner || mineQ ? q.name : maskName(q.name);
  return `<div class="qcard ${q.status}${mineQ ? " mine" : ""}" data-search="${esc((q.name + " " + q.no + " " + s.name).toLowerCase())}">
    <div class="tk">${esc(q.no)}</div>
    <div><div class="nm">${esc(shown)} <span class="age">${esc(q.age)}</span>${mineQ ? `<span class="you">Anda</span>` : ""}</div>
      <div class="meta"><span>${icon("scissors", 14)} ${esc(s.name)}</span><span>${icon("clock", 14)} ${fmtDur(s.mins)}</span>${eta}${owner ? `<span>${icon("phone", 14)} ${esc(q.phone)}</span>` : ""}</div></div>
    <div class="right">${statusBadge}<span class="price">${rp(s.price)}</span></div>
    ${acts ? `<div class="q-actions">${acts}</div>` : ""}</div>`;
}

/* --- Tiket pelanggan --- */
function myState(q) {
  if (q.status === "working") return { step: 2, title: "Giliran Anda sedang berlangsung", text: "Silakan menuju kursi pangkas." };
  const w = waiting(), idx = w.findIndex((x) => x.id === q.id);
  if (idx === 0) return { step: 1, key: "next", title: "Anda berikutnya!", text: "Mohon bersiap dan berada di sekitar toko." };
  return { step: 0, title: `${idx + working().length} orang di depan Anda`, text: "Anda bisa menunggu di rumah — kami akan memberi tahu saat giliran dekat." };
}
function ticketCard(q) {
  const st = myState(q), s = svc(q.service), mins = etaFor(q);
  const notifOk = "Notification" in window && Notification.permission === "granted";
  return `<div class="ticket">
    <div class="t-top"><div><div class="t-lbl">Tiket antrean Anda</div><div class="t-no">${esc(q.no)}</div></div>
      <span class="badge ${q.status === "working" ? "working" : ""}">${q.status === "working" ? "Dikerjakan" : "Menunggu"}</span></div>
    <div class="t-msg">${st.title}</div><div class="t-sub">${st.text}</div>
    <div class="t-stats">
      <div><small>Estimasi mulai</small><b>${q.status === "working" ? "Sekarang" : mins ? "±" + mins + " mnt" : "Segera"}</b></div>
      <div><small>Layanan</small><b style="font-size:1rem;font-family:var(--font-body)">${esc(s.name)}</b></div>
      <div><small>Biaya</small><b>${rpK(s.price)}</b></div></div>
    <div class="progress" aria-label="Progres antrean"><div class="on">Menunggu</div><div class="${st.step >= 1 ? "on" : ""}">Giliran berikutnya</div><div class="${st.step >= 2 ? "on" : ""}">Dikerjakan</div></div>
    <div class="btns">
      ${!notifOk && "Notification" in window ? `<button class="btn btn-outline btn-sm" data-action="notif">${icon("bell", 14)} Aktifkan pengingat</button>` : ""}
      ${db.settings.wa ? `<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${waLink(db.settings.wa, `Halo, saya ${q.name} (tiket ${q.no}).`)}">${icon("chat", 14)} Hubungi toko</a>` : ""}
      ${q.status === "waiting" ? `<button class="btn btn-danger btn-sm" data-action="cancel" data-id="${q.id}">Batalkan</button>` : ""}</div></div>`;
}

let histFilter = "semua";
function lastDays(n) {
  return Array.from({ length: n }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (n - 1 - i)); return d; });
}
function chartSvg() {
  const days = lastDays(7).map((d) => ({ d, key: dayKey(d), total: 0 }));
  db.history.forEach((h) => { if (h.status !== "done") return; const x = days.find((y) => y.key === dayKey(new Date(h.endedAt))); if (x) x.total += h.price; });
  const max = Math.max(50000, Math.ceil(Math.max(...days.map((x) => x.total)) / 50000) * 50000);
  const W = 720, H = 250, L = 46, B = 30, T = 18, bw = (W - L - 10) / 7;
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const grid = [0, .5, 1].map((f) => `<line class="grid" x1="${L}" x2="${W - 6}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${L - 8}" y="${y(max * f) + 4}" text-anchor="end">${rpK(max * f)}</text>`).join("");
  const bars = days.map((x, i) => {
    const bx = L + i * bw + bw * .18, w = bw * .64, top = y(x.total), isT = i === 6;
    return `<rect class="bar${isT ? " today" : ""}" x="${bx}" y="${top}" width="${w}" height="${Math.max(0, y(0) - top)}" rx="5"/>
      ${x.total ? `<text class="val" x="${bx + w / 2}" y="${top - 6}" text-anchor="middle">${rpK(x.total)}</text>` : ""}
      <text x="${bx + w / 2}" y="${H - 9}" text-anchor="middle">${isT ? "Hari ini" : WEEKDAYS[x.d.getDay()]}</text>`;
  }).join("");
  const total = days.reduce((a, x) => a + x.total, 0);
  return { total, svg: `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik pendapatan 7 hari terakhir, total ${rp(total)}">${grid}${bars}</svg>` };
}
function tabRiwayat() {
  const { total, svg } = chartSvg();
  const doneAll = db.history.filter((h) => h.status === "done");
  const since = new Date(); since.setDate(since.getDate() - 6); since.setHours(0, 0, 0, 0);
  const week = doneAll.filter((h) => new Date(h.endedAt) >= since);
  const byS = {};
  week.forEach((h) => { (byS[h.serviceName] ||= { n: 0, t: 0 }); byS[h.serviceName].n++; byS[h.serviceName].t += h.price; });
  const top = Object.entries(byS).sort((a, b) => b[1].n - a[1].n).slice(0, 5), topMax = top[0]?.[1].n || 1;
  const rows = db.history.slice().sort((a, b) => new Date(b.endedAt) - new Date(a.endedAt))
    .filter((h) => histFilter === "semua" || (histFilter === "hari" && isToday(h.endedAt)) || histFilter === h.status);
  const hasDemo = db.history.some((h) => h.demo);
  return `
    <div class="kpis">
      <div class="kpi"><small>Pendapatan hari ini</small><b>${rp(revenueToday())}</b></div>
      <div class="kpi"><small>7 hari terakhir</small><b>${rp(total)}</b></div>
      <div class="kpi"><small>Pelanggan selesai (7 hari)</small><b>${week.length}</b></div>
      <div class="kpi"><small>Rata-rata per pelanggan</small><b>${rp(week.length ? Math.round(total / week.length) : 0)}</b></div></div>
    <div class="report-grid">
      <div class="card"><h3>Pendapatan 7 hari terakhir</h3><p class="sub">Berdasarkan layanan yang ditandai selesai.${hasDemo ? " Termasuk data contoh." : ""}</p>${svg}</div>
      <div class="card"><h3>Layanan terlaris</h3><p class="sub">7 hari terakhir</p>
        <div class="hbars">${top.length ? top.map(([n, v]) => `<div class="hbar"><div class="top"><span>${esc(n)}</span><span>${v.n}× · ${rpK(v.t)}</span></div><div class="track"><i style="width:${(v.n / topMax) * 100}%"></i></div></div>`).join("") : `<p class="empty">Belum ada data.</p>`}</div></div></div>
    <div class="card table-card"><div class="hd"><div><h3>Riwayat transaksi</h3><p class="sub" style="margin:0">${rows.length} catatan${rows.length > 25 ? " (25 terbaru; ekspor CSV untuk semua)" : ""}</p></div>
      <div class="pills no-print" role="radiogroup" aria-label="Filter riwayat">${[["semua", "Semua"], ["hari", "Hari ini"], ["done", "Selesai"], ["cancelled", "Dibatalkan"]].map(([v, l]) => `<label class="pill"><input type="radio" name="hf" value="${v}" data-action="histFilter" ${histFilter === v ? "checked" : ""}/><span>${l}</span></label>`).join("")}</div>
      <div class="no-print" style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" data-action="exportCsv">${icon("download", 14)} Ekspor CSV</button><button class="btn btn-ghost btn-sm" data-action="print">${icon("print", 14)} Cetak</button></div></div>
      <div class="table-wrap"><table><thead><tr><th>Tiket</th><th>Pelanggan</th><th>Layanan</th><th>Waktu</th><th>Status</th><th>Bayar</th><th class="num">Total</th></tr></thead><tbody>
      ${rows.length ? rows.slice(0, 25).map((h) => `<tr><td>${esc(h.no)}</td><td>${esc(h.name)}${h.demo ? `<span class="sample">contoh</span>` : ""}</td><td>${esc(h.serviceName)}</td><td>${fmtDate(h.endedAt)} ${fmtTime(h.endedAt)}</td>
        <td><span class="badge ${h.status}">${h.status === "done" ? "Selesai" : "Dibatalkan"}</span></td><td>${esc(h.method || "—")}</td><td class="num">${h.status === "done" ? rp(h.price) : "—"}</td></tr>`).join("") : `<tr><td colspan="7"><p class="empty" style="border:0">Belum ada riwayat.</p></td></tr>`}

/* ===================== FILTER PENCARIAN ===================== */
function applyFilter() {
  const input = $("[data-filter]", mainEl());
  if (!input) return;
  const q = input.value.trim().toLowerCase();
  ui.filter = q;
  let shown = 0;
  $$("[data-search]", mainEl()).forEach((el) => { const m = !q || el.dataset.search.includes(q); el.hidden = !m; if (m) shown++; });
  const nr = $("#no-result", mainEl()); if (nr) nr.hidden = shown > 0 || !q;
}
document.addEventListener("input", (e) => {
  if (e.target.matches("[data-filter]")) applyFilter();
  if (e.target.id === "pass" && $("#pw-meter")) pwStrength(e.target.value);
});
function pwStrength(v) {
  let s = 0; if (v.length >= 6) s++; if (v.length >= 10) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v)) s++;
  const m = $("#pw-meter"); m.style.width = `${(s / 5) * 100}%`; m.style.background = s <= 2 ? "var(--red)" : s <= 3 ? "var(--gold)" : "var(--green)";
  $("#pw-hint").textContent = !v ? "Gunakan huruf, angka, dan simbol." : s <= 2 ? "Kekuatan: lemah" : s <= 3 ? "Kekuatan: cukup" : "Kekuatan: kuat";
}

/* ===================== FORM HANDLER ===================== */
const setErr = (root, errs) => { Object.entries(errs).forEach(([k, v]) => { const el = $(`[data-err="${k}"]`, root); if (el) el.textContent = v; }); return Object.values(errs).some(Boolean); };
const phoneOk = (p) => /^(\+62|62|0)8\d{7,12}$/.test(p);
const forms = {
  async login(form) {
    const email = $("#email").value.trim().toLowerCase(), pass = $("#pass").value, box = $("#form-error");
    box.hidden = true;
    if (setErr(form, { email: /^\S+@\S+\.\S+$/.test(email) ? "" : "Masukkan email yang valid.", pass: pass.length >= 6 ? "" : "Kata sandi minimal 6 karakter." })) return;
    if (Date.now() < lock.until) { box.textContent = `Terlalu banyak percobaan. Coba lagi dalam ${Math.ceil((lock.until - Date.now()) / 1000)} detik.`; box.hidden = false; return; }
    const u = db.users.find((x) => x.email === email);
    if (!u || (await hashPass(pass, u.salt)) !== u.hash) {
      if (++lock.fails >= 5) { lock.until = Date.now() + 30000; lock.fails = 0; }
      box.textContent = "Email atau kata sandi salah."; box.hidden = false; return;
    }
    lock.fails = 0; session = { role: "pemilik", email: u.email }; saveSession();
    toast("Berhasil masuk.", "success"); go(shopPath());
  },
  async register(form) {
    const email = $("#email").value.trim().toLowerCase(), pass = $("#pass").value, pass2 = $("#pass2").value;
    if (setErr(form, { email: /^\S+@\S+\.\S+$/.test(email) ? "" : "Masukkan email yang valid.", pass: pass.length >= 6 ? "" : "Kata sandi minimal 6 karakter.", pass2: pass === pass2 ? "" : "Kata sandi tidak sama." })) return;
    if (db.users.some((u) => u.email === email)) { const b = $("#form-error"); b.textContent = "Email sudah terdaftar. Silakan masuk."; b.hidden = false; return; }
    db.users.push(await makeUser(email, pass)); save();
    toast("Akun dibuat. Silakan masuk.", "success"); go("/login");
  },
  checkin(form) {
    const name = $("#c-name").value.trim(), phone = $("#c-phone").value.replace(/[\s-]/g, "");
    if (setErr(form, { name: name.length < 2 ? "Isi nama minimal 2 huruf." : "", phone: phoneOk(phone) ? "" : "Nomor HP tidak valid (contoh 081234567890)." })) return;
    if (db.queue.some((x) => x.phone === phone)) return setErr(form, { phone: "Nomor ini sudah ada di antrean." });
    if (!isOwner() && !db.settings.accepting) return toast("Antrian sedang ditutup.", "error");
    if (waiting().length >= db.settings.maxWaiting) return toast("Antrian penuh. Silakan coba lagi nanti.", "error");
    const id = Date.now(), age = $("#c-age").value;
    const q = { id, no: nextTicketNo(), name, age, service: $("#c-svc").value, phone, status: "waiting", createdAt: new Date().toISOString() };
    db.queue.push(q);
    if (!isOwner()) { db.mine.push(id); ls.set("wber_profile", { name, phone, age }); }
    save(); closeModal(); render({ keep: true });
    toast(isOwner() ? `${name} masuk antrian (${q.no}).` : `Berhasil! Nomor antrean Anda ${q.no}.`, "success");
  },
  service(form) {
    const id = form.dataset.id, name = $("#v-name").value.trim(), price = Number($("#v-price").value), mins = Number($("#v-mins").value);
    if (setErr(form, { name: name.length < 3 ? "Nama minimal 3 huruf." : "", price: price >= 0 && Number.isFinite(price) && $("#v-price").value !== "" ? "" : "Masukkan harga.", mins: mins >= 5 ? "" : "Durasi minimal 5 menit." })) return;
    if (id) Object.assign(db.services.find((s) => s.id === id), { name, price, mins });
    else db.services.push({ id: "s" + Date.now().toString(36), name, price, mins });
    save(); closeModal(); render({ keep: true }); toast("Layanan disimpan.", "success");
  },
  settings(form) {
    const open = $("#s-open").value, close = $("#s-close").value, wa = $("#s-wa").value.replace(/[\s-]/g, "");
    if (setErr(form, { wa: wa && !phoneOk(wa) ? "Nomor WhatsApp tidak valid." : "" })) return;
    if (!open || !close || open >= close) return toast("Jam tutup harus setelah jam buka.", "error");
    Object.assign(db.settings, { open, close, wa, chairs: Math.min(6, Math.max(1, Number($("#s-chairs").value) || 1)), maxWaiting: Math.min(99, Math.max(1, Number($("#s-max").value) || 15)) });
    save(); render({ keep: true }); toast("Pengaturan disimpan.", "success");
  },
  async password(form) {
    const old = $("#p-old").value, nw = $("#p-new").value, u = db.users.find((x) => x.email === session.email);
    if (setErr(form, { old: "", new: nw.length >= 6 ? "" : "Minimal 6 karakter." })) return;
    if ((await hashPass(old, u.salt)) !== u.hash) return setErr(form, { old: "Kata sandi saat ini salah." });
    Object.assign(u, await makeUser(u.email, nw)); save(); form.reset(); toast("Kata sandi diperbarui.", "success");
  },
};
const lock = { fails: 0, until: 0 };

/* ===================== EKSPOR CSV ===================== */
function exportCsv() {
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["Tiket", "Nama", "Kategori", "Layanan", "Harga", "Status", "Metode", "Dibuat", "Selesai", "Telepon"];
  const rows = db.history.slice().sort((a, b) => new Date(a.endedAt) - new Date(b.endedAt)).map((h) => [h.no, h.name, h.age, h.serviceName, h.price, h.status === "done" ? "Selesai" : "Dibatalkan", h.method || "", h.createdAt, h.endedAt, h.phone]);
  const csv = "﻿" + [head, ...rows].map((r) => r.map(cell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `riwayat-wbershop-${dayKey()}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Riwayat diekspor ke CSV.", "success");
}

/* ===================== PENGINGAT PELANGGAN ===================== */
const lastState = {};
function trackMyTicket() {
  const q = myTicket();
  if (!q || isOwner()) { document.title = document.title.replace(/^\(.*?\)\s/, ""); return; }
  const st = myState(q), key = q.status === "working" ? "working" : st.key || "wait";
  document.title = `(${q.no}${key === "wait" ? "" : " · " + (key === "next" ? "berikutnya" : "dipanggil")}) WberShop`;
  if (lastState[q.id] && lastState[q.id] !== key && (key === "next" || key === "working")) {
    const msg = key === "working" ? `Giliran Anda (${q.no}) sekarang!` : `Anda berikutnya (${q.no}). Mohon bersiap.`;
    toast(msg, "success");
    try { if ("Notification" in window && Notification.permission === "granted") new Notification("WberShop", { body: msg, icon: A.logo }); } catch {}
  }
  lastState[q.id] = key;
}

/* ===================== EVENT GLOBAL ===================== */
document.addEventListener("click", (e) => {
  const mod = $("#modal");
  if (e.target === mod) return closeModal();
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (!fn) return;
  if (el.tagName === "INPUT") return; // radio/checkbox ditangani lewat event "change"
  fn(el.dataset, el, e);
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.matches("input[type=radio][data-action], input[type=checkbox][data-action]")) actions[el.dataset.action]?.(el.dataset, el, e);
});
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  const btn = f.querySelector("[type=submit]"); if (btn?.disabled) return;
  if (btn) btn.disabled = true;
  try { await forms[f.dataset.form]?.(f); } finally { if (btn) btn.disabled = false; }
});
document.addEventListener("keydown", (e) => {
  if (!modalOpen()) return;
  if (e.key === "Escape") return closeModal();
  if (e.key === "Tab") { // jebakan fokus di dalam dialog
    const f = $$("a[href],button:not([disabled]),input:not([type=hidden]),select,textarea", $("#modal")).filter((x) => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
// Sinkron antar tab di perangkat yang sama
window.addEventListener("storage", (e) => {
  if (e.key !== KEY || !e.newValue) return;
  try { db = JSON.parse(e.newValue); } catch { return; }
  safeRefresh();
});
// Segarkan estimasi waktu secara berkala
function safeRefresh() {
  if (modalOpen() || document.hidden) return;
  const a = document.activeElement;
  if (a && a.closest("main") && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return;
  const { p0 } = parseRoute();
  if (["", "shop", "shops", "map"].includes(p0)) render({ keep: true });
}
setInterval(safeRefresh, 30000);

/* ===================== MULAI ===================== */
initDb().then(() => {
  if (!location.hash) history.replaceState(null, "", "#/");
  render();
});

</script>
